<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="rune_nexus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>rune_nexus</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #02070d;
      overflow: hidden;
    }

    #loading-screen,
    #loading-screen * {
      box-sizing: border-box;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      overflow: auto;
      background:
        linear-gradient(180deg, #02070d24 0%, #02070d00 36%, #02070d92 72%, #02070ded 100%),
        url("assets/assets/images/main_menu_background.jpg") top center / cover,
        #02070d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 1;
      transition: opacity 140ms ease-out;
    }

    #loading-screen.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      display: flex;
      min-height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top) 28px env(safe-area-inset-bottom);
    }

    .loading-emblem {
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: center;
      padding: clamp(24px, 9vh, 72px) 0 24px;
      flex-shrink: 0;
    }

    .loading-logo {
      display: block;
      width: min(310px, 100%);
      height: auto;
    }

    .loading-divider {
      width: 96px;
      height: 1px;
      margin: 18px 0 0;
      background: linear-gradient(90deg, transparent, #e7c66a99, transparent);
    }

    .loading-core {
      display: block;
      width: clamp(100px, 30vh, 230px);
      margin: 24px 0;
      flex-shrink: 0;
      height: auto;
    }

    .loading-bottom {
      width: min(420px, 100%);
      padding-bottom: 54px;
      flex-shrink: 0;
      text-align: center;
    }

    .loading-caption {
      margin: 0 0 18px;
      color: #e8f8ff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.6;
      word-break: keep-all;
      overflow-wrap: anywhere;
      text-shadow: 0 0 8px #000;
    }

    .loading-track {
      height: 24px;
      border: 8px solid transparent;
      border-image: url("assets/assets/images/ui/components/button_frame.png") 32 fill stretch;
    }

    .loading-track-inner {
      height: 8px;
      overflow: hidden;
      background: #061219;
    }

    .loading-fill {
      width: 38%;
      height: 100%;
      background: linear-gradient(180deg, #bff4ff, #50cadd, #146781);
      box-shadow: 0 0 5px #50cadd99;
      animation: rune-loading 1.8s linear infinite;
    }

    @keyframes rune-loading {
      from { transform: translateX(-105%); }
      to { transform: translateX(280%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-screen { transition: none; }
      .loading-fill { animation: none; }
      .loading-fill { width: 100%; transform: none; background: linear-gradient(180deg, #183a46, #0a202b); box-shadow: none; }
    }
  </style>
</head>
<body>
  <div id="loading-screen" aria-label="Rune Nexus 로딩">
    <div class="loading-content">
      <div class="loading-emblem">
        <img class="loading-logo" src="assets/assets/images/rune_nexus_logo_serif.png"
          alt="Rune Nexus" width="355" height="80">
        <div class="loading-divider" aria-hidden="true"></div>
      </div>
      <img class="loading-core" src="assets/assets/images/core_passive_tree/nexus_core.png"
          alt="" width="384" height="384" aria-hidden="true">
      <div class="loading-bottom">
        <p class="loading-caption" role="status">게임 실행 환경을 준비하는 중</p>
        <div class="loading-track" role="progressbar" aria-label="게임 실행 환경 준비">
          <div class="loading-track-inner"><div class="loading-fill"></div></div>
        </div>
      </div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('is-leaving');
        window.setTimeout(function () {
          loadingScreen.remove();
        }, 160);
      }
    });
  </script>
  <!-- flutter_angle 0.4.2 WebGL2 interop; license in vendor/flutter_angle/. -->
  <script src="vendor/flutter_angle/gles_bindings.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

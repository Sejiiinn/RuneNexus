<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="rune_nexus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>rune_nexus</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #07111d;
      overflow: hidden;
    }

    #loading-screen,
    #loading-screen * {
      box-sizing: border-box;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 38%, #123144 0%, #0a1b29 25%, #07111d 62%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 1;
      transition: opacity 140ms ease-out;
      will-change: opacity;
    }

    #loading-screen.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    .loading-ambient {
      position: absolute;
      top: 38%;
      left: 50%;
      width: 240px;
      height: 240px;
      border: 1px solid rgb(94 226 255 / 7%);
      border-radius: 50%;
      box-shadow:
        0 0 90px rgb(46 211 255 / 5%),
        inset 0 0 70px rgb(46 211 255 / 3%);
      transform: translate(-50%, -50%);
    }

    .loading-ambient::before,
    .loading-ambient::after {
      position: absolute;
      inset: 32px;
      content: "";
      border: 1px solid rgb(231 198 106 / 5%);
      border-radius: 50%;
    }

    .loading-ambient::after {
      inset: 76px;
      border-color: rgb(94 226 255 / 8%);
    }

    .loading-core {
      position: absolute;
      top: 38%;
      left: 50%;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
    }

    .loading-orbit {
      position: absolute;
      inset: 0;
      border: 1.5px solid rgb(142 230 255 / 24%);
      border-top-color: #8ee6ff;
      border-right-color: rgb(142 230 255 / 58%);
      border-radius: 50%;
      filter: drop-shadow(0 0 6px rgb(46 211 255 / 32%));
      animation: rune-orbit 1.4s linear infinite;
    }

    .loading-orbit::after {
      position: absolute;
      top: 3px;
      right: 8px;
      width: 4px;
      height: 4px;
      content: "";
      background: #e7c66a;
      border-radius: 50%;
      box-shadow: 0 0 9px rgb(231 198 106 / 75%);
    }

    .loading-diamond {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      border: 1.5px solid #8ee6ff;
      background: rgb(15 62 82 / 82%);
      box-shadow:
        0 0 14px rgb(46 211 255 / 38%),
        inset 0 0 8px rgb(142 230 255 / 30%);
      transform: translate(-50%, -50%) rotate(45deg);
      animation: rune-core-pulse 1.1s ease-in-out infinite alternate;
    }

    .loading-diamond::after {
      position: absolute;
      inset: 5px;
      content: "";
      background: #e8fbff;
      border-radius: 1px;
      box-shadow: 0 0 8px #8ee6ff;
    }

    .loading-bottom {
      position: absolute;
      right: 36px;
      bottom: max(42px, env(safe-area-inset-bottom));
      left: 36px;
      text-align: center;
    }

    .loading-caption {
      margin-bottom: 14px;
      color: #b9d6e4;
      font-size: 13px;
      font-weight: 600;
    }

    .loading-track {
      width: min(286px, 100%);
      height: 5px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgb(94 226 255 / 14%);
      border-radius: 999px;
      background: rgb(46 211 255 / 9%);
    }

    .loading-fill {
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(90deg, transparent, #8ee6ff 46%, #e8fbff 58%, transparent);
      filter: drop-shadow(0 0 4px rgb(142 230 255 / 52%));
      animation: rune-loading 1.25s ease-in-out infinite;
    }

    @keyframes rune-orbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rune-core-pulse {
      from {
        opacity: 0.68;
        transform: translate(-50%, -50%) rotate(45deg) scale(0.88);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(45deg) scale(1);
      }
    }

    @keyframes rune-loading {
      from {
        transform: translateX(-105%);
      }
      to {
        transform: translateX(280%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-screen {
        transition: none;
      }

      .loading-orbit,
      .loading-diamond,
      .loading-fill {
        animation: none;
      }

      .loading-fill {
        transform: translateX(82%);
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen" aria-label="Rune Nexus loading">
    <div class="loading-ambient" aria-hidden="true"></div>
    <div class="loading-core" aria-hidden="true">
      <div class="loading-orbit"></div>
      <div class="loading-diamond"></div>
    </div>
    <div class="loading-bottom">
      <div class="loading-caption">게임을 시작하는 중</div>
      <div
        class="loading-track"
        role="progressbar"
        aria-label="게임 실행 환경 준비"
      >
        <div class="loading-fill"></div>
      </div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('is-leaving');
        window.setTimeout(function () {
          loadingScreen.remove();
        }, 160);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

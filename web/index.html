<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="rune_nexus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>rune_nexus</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #07111d;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 58px 36px 42px;
      color: #e8fbff;
      background:
        radial-gradient(circle at 50% 18%, #102a3a 0%, #07111d 62%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .loading-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .loading-mark {
      width: 112px;
      height: 112px;
    }

    .loading-title {
      margin-top: 12px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2.6px;
    }

    .loading-subtitle {
      color: #7db8c8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .loading-bottom {
      width: min(318px, 100%);
      text-align: center;
    }

    .loading-caption {
      margin-bottom: 14px;
      color: #b9d6e4;
      font-size: 13px;
      font-weight: 600;
    }

    .loading-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(46, 211, 255, 0.2);
    }

    .loading-fill {
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: #8ee6ff;
      animation: rune-loading 1.1s ease-in-out infinite alternate;
    }

    @keyframes rune-loading {
      from {
        transform: translateX(-72%);
      }
      to {
        transform: translateX(202%);
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen" aria-label="Rune Nexus loading">
    <div class="loading-logo">
      <svg class="loading-mark" viewBox="0 0 112 112" aria-hidden="true">
        <circle cx="56" cy="56" r="47" fill="#153447"/>
        <circle cx="56" cy="56" r="47" fill="none" stroke="#8EE6FF" stroke-width="4"/>
        <path d="M56 19 L76 56 L56 93 L36 56 Z" fill="none" stroke="#E7C66A" stroke-width="6" stroke-linejoin="round"/>
        <path d="M56 36 L56 76 M43 56 L69 56" fill="none" stroke="#E7C66A" stroke-width="6" stroke-linecap="round"/>
        <circle cx="56" cy="56" r="8" fill="#8EE6FF"/>
      </svg>
      <div class="loading-title">RUNE NEXUS</div>
      <div class="loading-subtitle">룬 넥서스 준비 중</div>
    </div>
    <div class="loading-bottom">
      <div class="loading-caption">게임 실행 환경을 준비하는 중</div>
      <div class="loading-track"><div class="loading-fill"></div></div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.remove();
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

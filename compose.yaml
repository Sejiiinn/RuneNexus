name: rune-nexus

services:
  db:
    image: postgres:18
    container_name: rune-nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rune_nexus
      POSTGRES_USER: rune_nexus_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rune_nexus_postgres_data:/var/lib/postgresql
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rune_nexus_app -d rune_nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile.migrate
      args:
        GO_VERSION: 1.26.5
        TERN_VERSION: 2.4.1
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: rune_nexus
      PGUSER: rune_nexus_app
      PGPASSWORD_FILE: /run/secrets/postgres_password
      PGSSLMODE: disable
      TERN_MIGRATIONS: /migrations
    volumes:
      - ./server/db/migrations:/migrations:ro
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        GO_VERSION: 1.26.5
    init: true
    restart: unless-stopped
    environment:
      HTTP_ADDRESS: :8080
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: rune_nexus
      DATABASE_USER: rune_nexus_app
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_SSLMODE: disable
      DATABASE_CONNECT_TIMEOUT: 5s
      READINESS_TIMEOUT: 2s
      SHUTDOWN_TIMEOUT: 10s
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      IDENTITY_VERIFY_TIMEOUT: 5s
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1m}
      GOOGLE_AUTH_RATE_LIMIT: ${GOOGLE_AUTH_RATE_LIMIT:-10}
      REFRESH_AUTH_RATE_LIMIT: ${REFRESH_AUTH_RATE_LIMIT:-30}
      LEGACY_TRANSFER_CREATE_RATE_LIMIT: ${LEGACY_TRANSFER_CREATE_RATE_LIMIT:-3}
      LEGACY_TRANSFER_CONSUME_RATE_LIMIT: ${LEGACY_TRANSFER_CONSUME_RATE_LIMIT:-10}
      AUTH_RATE_LIMIT_MAX_CLIENTS: ${AUTH_RATE_LIMIT_MAX_CLIENTS:-10000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:53000}
      MAX_SAVE_BODY_BYTES: ${MAX_SAVE_BODY_BYTES:-4194304}
      MINIMUM_SAVE_CLIENT_COMPATIBILITY_VERSION: ${MINIMUM_SAVE_CLIENT_COMPATIBILITY_VERSION:-1}
      LEGACY_LOCAL_TRANSFER_ENABLED: ${LEGACY_LOCAL_TRANSFER_ENABLED:-true}
      LEGACY_TRANSFER_TTL: ${LEGACY_TRANSFER_TTL:-15m}
      TZ: UTC
    ports:
      - "127.0.0.1:8080:8080"
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=-",
          "http://127.0.0.1:8080/health/live",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  postgres_password:
    file: ./.secrets/postgres_password

volumes:
  rune_nexus_postgres_data:

name: Godot checks
description: Download the pinned Godot and run the contract, regression and prepared-project checks shared by push CI and the APK release.
inputs:
  group:
    description: Stage group of scripts/run_godot_ci_checks.py, or all.
    default: all
runs:
  using: composite
  steps:
    - name: Prepare Godot renderer
      shell: bash
      run: |
        python3 - <<'PYGODOT'
        import hashlib, os, pathlib, socket, time, urllib.request, zipfile
        version = "4.7.2-stable"
        archive_name = f"Godot_v{version}_linux.x86_64.zip"
        expected = "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
        folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "godot"
        folder.mkdir(exist_ok=True)
        archive = folder / archive_name
        # Release downloads fail transiently (504s); a hung read must retry too.
        socket.setdefaulttimeout(60)
        for attempt in range(1, 5):
            try:
                urllib.request.urlretrieve(
                    f"https://github.com/godotengine/godot/releases/download/{version}/{archive_name}",
                    archive,
                )
                break
            except OSError as error:
                if attempt == 4:
                    raise
                print(f"Godot download attempt {attempt} failed: {error}", flush=True)
                time.sleep(5 * attempt)
        if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
            raise SystemExit("Godot archive checksum mismatch")
        executable = folder / f"Godot_v{version}_linux.x86_64"
        with zipfile.ZipFile(archive) as package:
            executable.write_bytes(package.read(executable.name))
        executable.chmod(0o755)
        with open(os.environ["GITHUB_ENV"], "a") as environment:
            environment.write(f"GODOT_EXECUTABLE={executable}\n")
        PYGODOT

    # Runs every independent check even after a failure, lists all failures at
    # the end and exits non-zero when any check failed or could not run.
    - name: Verify contracts, regressions and prepared project
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
      run: python3 scripts/run_godot_ci_checks.py --group "$GROUP"

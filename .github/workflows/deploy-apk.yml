name: Deploy Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: '기존 모든 APK보다 큰 정수 (최초 배포도 설치된 앱보다 큰 값)'
        required: true
        type: string
      version_name:
        description: '표시 버전 (예: 0.2.0)'
        required: true
        type: string
      required_update:
        description: '필수 업데이트 (이전 버전의 게임 시작 차단)'
        required: true
        default: false
        type: boolean
      notes:
        description: '업데이트 안내'
        required: true
        type: string
      publish:
        description: '검증 후 GitHub Release 공개 (기본값은 빌드 산출물만 보관)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      RELEASE_NOTES: ${{ inputs.notes }}
      REQUIRED_UPDATE: ${{ inputs.required_update }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      RUNE_NEXUS_API_BASE_URL: ${{ vars.RUNE_NEXUS_API_BASE_URL }}
      RUNE_NEXUS_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/update.json
      RUNE_NEXUS_CLIENT_BUILD: android:${{ github.sha }}
      RUNE_NEXUS_REQUIRE_PRODUCTION_CONFIG: 'true'
      RUNE_NEXUS_REQUIRE_RELEASE_SIGNING: 'true'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rune-nexus-signing.jks
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re
          code = os.environ["VERSION_CODE"]
          if not re.fullmatch(r"[1-9][0-9]*", code) or int(code) > 2100000000:
              raise SystemExit("Invalid Android versionCode")
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", os.environ["VERSION_NAME"]):
              raise SystemExit("version_name must use x.y.z format, for example 0.2.0")
          for name in ["VERSION_NAME", "RELEASE_NOTES", "GOOGLE_WEB_CLIENT_ID",
                       "RUNE_NEXUS_API_BASE_URL", "ANDROID_KEYSTORE_BASE64",
                       "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]:
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"Missing configuration: {name}")
          if not os.environ["RUNE_NEXUS_API_BASE_URL"].startswith("https://"):
              raise SystemExit("Distribution API URL must use HTTPS")
          key = pathlib.Path(os.environ["ANDROID_KEYSTORE_PATH"])
          key.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
          key.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"ANDROID_KEYSTORE_PATH={key}\n")
          pathlib.Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(
              os.environ["RELEASE_NOTES"], encoding="utf-8")
          PY
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/existing-releases.json"
          python3 - <<'PY'
          import json, os, pathlib, re
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          releases = [release for page in json.loads((temp / "existing-releases.json").read_text()) for release in page]
          tags = [release["tag_name"] for release in releases]
          (temp / "existing-apk-tags.txt").write_text("\n".join(tags), encoding="utf-8")
          previous = [int(m.group(1)) for tag in tags if (m := re.fullmatch(r"apk-(\d+)", tag))]
          if previous and int(os.environ["VERSION_CODE"]) <= max(previous):
              raise SystemExit("Choose a versionCode larger than every existing APK release")
          published = [
              (int(match.group(1)), release["tag_name"])
              for release in releases
              if not release["draft"] and release.get("published_at")
              and (match := re.fullmatch(r"apk-([1-9][0-9]*)", release["tag_name"]))
          ]
          (temp / "patch-base-tags.json").write_text(
              json.dumps([tag for _, tag in sorted(published, reverse=True)[:3]]))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android-godot-only/**/*.gradle*
            android-godot-only/gradle.properties
            android-godot-only/gradle/wrapper/gradle-wrapper.properties

      - name: Prepare Godot renderer
        run: |
          python3 - <<'PYGODOT'
          import hashlib, os, pathlib, urllib.request, zipfile
          version = "4.7.2-stable"
          archive_name = f"Godot_v{version}_linux.x86_64.zip"
          expected = "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "godot"
          folder.mkdir(exist_ok=True)
          archive = folder / archive_name
          urllib.request.urlretrieve(
              f"https://github.com/godotengine/godot/releases/download/{version}/{archive_name}",
              archive,
          )
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("Godot archive checksum mismatch")
          executable = folder / f"Godot_v{version}_linux.x86_64"
          with zipfile.ZipFile(archive) as package:
              executable.write_bytes(package.read(executable.name))
          executable.chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"GODOT_EXECUTABLE={executable}\n")
          PYGODOT

      - name: Build signed APK
        env:
          # 입력이 같은 Gradle 작업의 빌드 결과 재사용
          GRADLE_OPTS: -Dorg.gradle.caching=true
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/verify_godot_content.py
          GODOT_BIN="$GODOT_EXECUTABLE" python3 scripts/run_godot_native_regressions.py
          GODOT_BIN="$GODOT_EXECUTABLE" python3 scripts/verify_godot_account_services.py
          GODOT_BIN="$GODOT_EXECUTABLE" python3 scripts/verify_godot_app_services.py
          python3 scripts/build_godot_pack.py
          android-godot-only/gradlew -p android-godot-only :app:assembleProductionRelease --console=plain
          mkdir -p build/apk-release
          cp build/godot-only/app/outputs/apk/production/release/app-production-release.apk build/apk-release/rune-nexus.apk
      - name: Audit packaged Godot resources
        run: |
          python3 scripts/audit_godot_pack.py build/apk-release/rune-nexus.apk --output build/godot-pack-audit.json
          python3 - <<'PYREPORT'
          import json
          report = json.load(open("build/godot-pack-audit.json"))
          print(f"Godot PCK: {report['pack_bytes']} bytes, {report['entry_count']} entries, exact duplicate payloads: {report['logical_duplicate_bytes']} bytes")
          PYREPORT

      - name: Save packaged resource audit
        uses: actions/upload-artifact@v4
        with:
          name: godot-pack-audit-${{ inputs.version_code }}
          path: build/godot-pack-audit.json

      - name: Verify Android patch decoder
        run: python3 scripts/run_apk_delta_kotlin_tests.py

      - name: Prepare verified differential updates
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          base_root = temp / "apk-bases"
          base_root.mkdir()
          sdk = pathlib.Path(os.environ["ANDROID_HOME"])
          apksigner = sorted(
              (sdk / "build-tools").glob("*/apksigner"),
              key=lambda path: tuple(int(part) for part in re.findall(r"\d+", path.parent.name)),
          )[-1]
          def certificates(apk):
              result = subprocess.run(
                  [str(apksigner), "verify", "--print-certs", str(apk)],
                  check=True, capture_output=True, text=True,
              )
              hashes = set(re.findall(
                  r"^(?:V[0-9.]+ )?Signer[^\r\n]*certificate SHA-256 digest: ([0-9a-fA-F]{64})\s*$",
                  result.stdout, re.MULTILINE,
              ))
              if not hashes:
                  raise SystemExit(f"Unable to read verified APK signing certificates: {result.stdout}")
              return hashes
          target_certs = certificates(pathlib.Path("build/apk-release/rune-nexus.apk"))
          for tag in json.loads((temp / "patch-base-tags.json").read_text()):
              base_dir = base_root / tag
              base_dir.mkdir()
              subprocess.run(
                  ["gh", "release", "download", tag, "--pattern", "rune-nexus.apk",
                   "--pattern", "update.json", "--dir", str(base_dir)], check=True,
              )
              if certificates(base_dir / "rune-nexus.apk") != target_certs:
                  raise SystemExit(f"Signing certificate mismatch for {tag}; preserve the existing key")
          PY
          UPDATE_POLICY_ARGS=()
          if [[ "$REQUIRED_UPDATE" == "true" ]]; then
            UPDATE_POLICY_ARGS+=(--required-update)
          fi
          python3 scripts/create_apk_update_manifest.py "${UPDATE_POLICY_ARGS[@]}" \
            --apk build/apk-release/rune-nexus.apk \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --repository "$GH_REPO" --notes-file "$RUNNER_TEMP/release-notes.md" \
            --existing-tags-file "$RUNNER_TEMP/existing-apk-tags.txt" \
            --base-releases-dir "$RUNNER_TEMP/apk-bases" \
            --output build/apk-release/update.json
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          manifest = json.loads(pathlib.Path("build/apk-release/update.json").read_text())
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          for patch in manifest.get("patches", []):
              base = temporary / "apk-bases" / f"apk-{patch['fromVersionCode']}" / "rune-nexus.apk"
              patch_file = pathlib.Path("build/apk-release") / f"patch-from-{patch['fromVersionCode']}.rndelta"
              restored = temporary / f"kotlin-restored-{patch['fromVersionCode']}.apk"
              subprocess.run([
                  "python3", "scripts/run_apk_delta_kotlin_tests.py", str(base),
                  "build/apk-release/rune-nexus.apk", str(patch_file), str(restored),
              ], check=True)
              restored.unlink()
          PYCODE

      - name: Publish complete release
        if: ${{ inputs.publish }}
        run: |
          tag="apk-$VERSION_CODE"
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Rune Nexus $VERSION_NAME ($VERSION_CODE)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            build/apk-release/*
          gh release edit "$tag" --draft=false --latest

      - name: Save build-only release files
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: rune-nexus-apk-${{ inputs.version_code }}
          path: build/apk-release/*

      - name: Remove signing material
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

    <text x="200" y="487" text-anchor="middle" fill="var(--foreground)">기존 일반형 · 1.00</text>
    <text id="rn-tank-label" x="515" y="487" text-anchor="middle" fill="var(--foreground)">탱커 시안 · 1.20</text>
  </svg>
  <style>
    #rn-tank-size .rn-size-scene{width:100%;height:auto;display:block;overflow:visible}
    #rn-tank-size .rn-size-scene text{font-size:var(--font-size-base);font-family:inherit;font-weight:400}
    #rn-tank-size .viz-controls .form-label{flex:1}
  </style>
  <script>
  (() => {
    const root=document.getElementById('rn-tank-size');
    const slider=root.querySelector('#rn-tank-ratio');
    const output=root.querySelector('#rn-tank-value');
    const label=root.querySelector('#rn-tank-label');
    const normal=root.querySelector('#rn-normal-image');
    const tank=root.querySelector('#rn-tank-image');
    const h=270, floor=455;
    // Original-image visible height: normal 110..1017, tank 100..1212.
    function apply(value){
      const ratio=Math.min(1.5,Math.max(1,Number(value)||1.2));
      slider.value=ratio; output.textContent=ratio.toFixed(2)+'배';
      label.textContent='탱커 시안 · '+ratio.toFixed(2);
      const ns=h/907, ts=h*ratio/1112;
      normal.setAttribute('transform',`translate(${200-540*ns} ${floor-1017*ns}) scale(${ns})`);
      tank.setAttribute('transform',`translate(${515-603*ts} ${floor-1212*ts}) scale(${ts})`);
    }
    function restore(state){apply(state?.modelContent?.tankHeightRatio??1.2);}
    restore(window.openai?.widgetState);
    slider.addEventListener('input',()=>{
      apply(slider.value);
      window.openai?.setWidgetState({modelContent:{tankHeightRatio:Number(slider.value)},privateContent:null})?.catch(()=>{});
    });
    window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  })();
  </script>

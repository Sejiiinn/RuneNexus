<!doctype html><html lang="ko"><meta charset="utf-8"><title>중화기 증폭 젬 시안</title><style>*{box-sizing:border-box}body{margin:0;background:#10181d;color:#e5ecee;font-family:system-ui,sans-serif;padding:28px}h1{font-size:24px;margin:0 0 8px}p{color:#a9b8be;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{background:#19242a;border:1px solid #39474d;border-radius:12px;padding:18px 10px;text-align:center}.large{width:100%;height:220px;object-fit:contain}h2{font-size:17px;margin:8px 0}.desc{height:45px;font-size:13px;line-height:1.5;color:#a9b8be}.sizes{height:84px;display:flex;align-items:center;justify-content:center;gap:18px;border-top:1px solid #39474d;margin-top:15px}.size{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#9dacb4}.size img{object-fit:contain}.note{margin-top:22px;font-size:13px}.new{border-color:#638b8a}</style><h1>중화기 증폭 — PoE 보조 젬 참고 시안</h1><p>Q–U · 비슷한 기능과 실제 아이콘을 참고한 새 해석 · 24px / 40px 표시 · 게임 적용 전 시안</p><div class="grid" id="grid"></div><p class="note">하위 에이전트 3개가 각각 ImageGen으로 생성한 시안입니다. 원본 PNG는 같은 폴더에 보존했습니다.</p><script>const data=[['Q · 압쇄 루비','Pulverise 참고<br>피해 + 범위의 압쇄감','q-pulverise.png'],['R · 포악한 가넷','Brutality 참고<br>물리 타격의 강한 결속','r-brutality.png'],['S · 응축 사파이어','Concentrated Effect 참고<br>중심으로 응축한 화력','s-concentrated.png'],['T · 확장 청옥','Increased AoE 참고<br>외측으로 넓어지는 결정층','t-area.png'],['U · 중량 혈석','Melee Physical Damage 참고<br>묵직한 판상 결정의 결속','u-melee-physical.png']];document.getElementById('grid').innerHTML=data.map(([title,desc,src],i)=>`<article class="card ${'new'}"><img class="large" src="${src}"><h2>${title}</h2><div class="desc">${desc}</div><div class="sizes"><div class="size"><img src="${src}" width="24" height="24">24px</div><div class="size"><img src="${src}" width="40" height="40">40px</div></div></article>`).join('')</script></html>

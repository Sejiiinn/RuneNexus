<!doctype html><html lang="ko"><meta charset="utf-8"><title>중화기 증폭 젬 시안</title><style>*{box-sizing:border-box}body{margin:0;background:#10181d;color:#e5ecee;font-family:system-ui,sans-serif;padding:28px}h1{font-size:24px;margin:0 0 8px}p{color:#a9b8be;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#19242a;border:1px solid #39474d;border-radius:12px;padding:18px 10px;text-align:center}.large{width:100%;height:260px;object-fit:contain}h2{font-size:17px;margin:8px 0}.desc{height:45px;font-size:13px;line-height:1.5;color:#a9b8be}.sizes{height:84px;display:flex;align-items:center;justify-content:center;gap:18px;border-top:1px solid #39474d;margin-top:15px}.size{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#9dacb4}.size img{object-fit:contain}.note{margin-top:22px;font-size:13px}.new{border-color:#638b8a}</style><h1>중화기 증폭 — 두꺼운 기둥의 결합</h1><p>밀집 묶음 · 계단 · 엇물림 · 아래는 24px / 40px 표시 · 게임 적용 전 시안</p><div class="grid" id="grid"></div><p class="note">하위 에이전트 3개가 각각 ImageGen으로 생성한 시안입니다. 원본 PNG는 같은 폴더에 보존했습니다.</p><script>const data=[['W · 밀집 묶음형','다섯 개의 굵은 기둥이<br>밀착한 묵직한 덩어리','w-cluster.png'],['X · 계단형','높이가 다른 기둥들이<br>나란히 합쳐진 형태','x-stepped.png'],['Y · 엇물림형','세 기둥이 다른 각도로<br>비스듬히 결합한 형태','y-interlocked.png']];document.getElementById('grid').innerHTML=data.map(([title,desc,src],i)=>`<article class="card ${i>1?'new':''}"><img class="large" src="${src}"><h2>${title}</h2><div class="desc">${desc}</div><div class="sizes"><div class="size"><img src="${src}" width="24" height="24">24px</div><div class="size"><img src="${src}" width="40" height="40">40px</div></div></article>`).join('')</script></html>

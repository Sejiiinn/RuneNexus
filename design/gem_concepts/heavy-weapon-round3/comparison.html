<!doctype html><html lang="ko"><meta charset="utf-8"><title>중화기 증폭 새 컨셉 9개</title><style>*{box-sizing:border-box}body{margin:0;background:#10181d;color:#e5ecee;font-family:system-ui,sans-serif;padding:18px 28px}h1{font-size:22px;margin:0 0 4px}p{color:#a9b8be;margin:0 0 12px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#19242a;border:1px solid #39474d;border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;align-items:center;height:204px}.large{width:100%;height:180px;object-fit:contain}h2{font-size:17px;margin:0 0 8px}.desc{font-size:12px;line-height:1.5;color:#a9b8be}.sizes{display:flex;align-items:end;gap:16px;margin-top:14px}.size{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#9dacb4}.size img{object-fit:contain}a{color:inherit;text-decoration:none}</style><h1>중화기 증폭 — 새로운 컨셉 9개</h1><p>H–P · 원석 형태로 표현한 중량과 화력 · 하위 에이전트별 ImageGen 생성 · 게임 적용 전 시안</p><div class="grid" id="grid"></div><script>const data=[['H · 공성 망치','넓은 망치머리와 짧은 뿌리','h-siege-hammer.png'],['I · 텅스텐 큐브','초고밀도 금속의 육면체','i-tungsten-cube.png'],['J · 레일 프리즘','두꺼운 평행 결정과 에너지 틈','j-rail-prism.png'],['K · 파쇄 송곳','짧고 굵은 곡선형 파쇄 결정','k-breacher-tooth.png'],['L · 강선 결정','회전력을 담은 비틀린 광물','l-rifling-crystal.png'],['M · 공성 왕관','낮고 넓은 세 갈래 결정','m-siege-crown.png'],['N · 중량 원반','두꺼운 육각 원반과 성장층','n-ballast-disc.png'],['O · 충격파 지층','단계적으로 펼쳐진 결정층','o-shockwave-strata.png'],['P · 돌파 격자','네 방향으로 맞물린 굵은 결정','p-breach-cross.png']];document.getElementById('grid').innerHTML=data.map(([title,desc,src])=>`<article class="card"><a href="${src}"><img class="large" src="${src}"></a><div><h2>${title}</h2><div class="desc">${desc}</div><div class="sizes"><div class="size"><img src="${src}" width="24" height="24">24px</div><div class="size"><img src="${src}" width="40" height="40">40px</div></div></div></article>`).join('')</script></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><title>중화기 증폭 젬 시안</title><style>*{box-sizing:border-box}body{margin:0;background:#10181d;color:#e5ecee;font-family:system-ui,sans-serif;padding:28px}h1{font-size:24px;margin:0 0 8px}p{color:#a9b8be;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{background:#19242a;border:1px solid #39474d;border-radius:12px;padding:18px 10px;text-align:center}.large{width:100%;height:220px;object-fit:contain}h2{font-size:17px;margin:8px 0}.desc{height:45px;font-size:13px;line-height:1.5;color:#a9b8be}.sizes{height:84px;display:flex;align-items:center;justify-content:center;gap:18px;border-top:1px solid #39474d;margin-top:15px}.size{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#9dacb4}.size img{object-fit:contain}.note{margin-top:22px;font-size:13px}.new{border-color:#638b8a}</style><h1>중화기 증폭 — 원석 시안 비교</h1><p>기존 폭발 젬과 비교 · 아래는 24px / 40px 표시 · 게임 적용 전 시안</p><div class="grid" id="grid"></div><p class="note">하위 에이전트 3개가 각각 ImageGen으로 생성한 시안입니다. 원본 PNG는 같은 폴더에 보존했습니다.</p><script>const data=[['기존 폭발','주황 용암 · 방사형 결정','../../../design/legacy/assets/images/gems/explosion.png'],['기존 중화기 증폭','주황 균열 · 두꺼운 원석','../../../design/legacy/assets/images/gems/heavyWeapon.png'],['A · 대구경 포탄형','단일 탄두 실루엣과<br>묵직한 받침','a-shell.png'],['B · 포신형 원석','굵은 육각 포구와<br>청록빛 내부','b-barrel.png'],['C · 압축 동력핵형','두꺼운 흑철 결정과<br>응축된 보라색 에너지','c-core.png']];document.getElementById('grid').innerHTML=data.map(([title,desc,src],i)=>`<article class="card ${i>1?'new':''}"><img class="large" src="${src}"><h2>${title}</h2><div class="desc">${desc}</div><div class="sizes"><div class="size"><img src="${src}" width="24" height="24">24px</div><div class="size"><img src="${src}" width="40" height="40">40px</div></div></article>`).join('')</script></html>

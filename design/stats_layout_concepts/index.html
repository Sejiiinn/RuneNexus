<!doctype html><html lang="ko"><meta charset="utf-8"><title>스탯 컴포넌트 시안</title><style>
@font-face{font-family:Noto;src:url('../../assets/fonts/NotoSansKR-VF.ttf')}*{box-sizing:border-box}body{margin:0;background:#071019;color:#e8f8ff;font-family:Noto,sans-serif}main{padding:28px;width:848px;margin:auto}h1{font-size:23px;margin:0 0 7px}p{color:#8aa6b8;font-size:12px;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,380px);gap:20px}.concept{background:#0b1722;border:1px solid #263d4a;padding:14px 9px 12px;border-radius:8px}h2{font-size:15px;margin:0 5px 4px}h2 em{font-size:10px;font-style:normal;color:#63e6a5;margin-left:6px}.desc{font-size:11px;margin:0 5px 12px;height:34px;color:#9bb4c3}.state{font-size:9px;letter-spacing:1px;color:#688696;margin:9px 3px 5px}.panel{width:360px;background:linear-gradient(120deg,#101f2c,#0a121c);border:1px solid #304958;border-radius:5px;padding:8px}.head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;margin-bottom:7px}.head small{font-size:8px;color:#8aa6b8}.head b{color:#e7c66a}.cost{margin-left:auto;color:#e7c66a;font-size:11px}.tabs{display:flex;font-size:11px;text-align:center;border-bottom:1px solid #526c7c;margin-bottom:6px}.tabs span{width:50%;height:27px;padding:4px;border:1px solid #304958;border-bottom:0;border-radius:4px 4px 0 0;color:#8aa6b8}.tabs .on{color:#e8f8ff;border-color:#73b8d5;background:#142d3e}.meta{display:flex;align-items:center;gap:5px;font-size:9px;color:#adc0ca;margin-bottom:6px}.tag{border:1px solid #657584;border-radius:4px;padding:2px 5px}.tag.heavy{color:#ffa24a;border-color:#785536}.total{margin-left:auto}.total strong{color:#e8f8ff;font-size:11px}.stats{font-size:10px}.label{color:#8aa6b8}.value{font-size:12px;font-weight:800;color:#e8f8ff;white-space:nowrap}.crit .value{color:#e7c66a}.old{font-size:10px;color:#8aa6b8;font-weight:500}.arrow{color:#63e6a5;font-size:10px;margin:0 2px}.next{color:#e8f8ff;font-size:11px}.cell{min-width:0}.a{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}.a .cell{display:flex;align-items:center;justify-content:space-between;min-height:23px;border-bottom:1px solid #223442}.a .cell:nth-last-child(-n+2){border-bottom:0}.b{display:grid;grid-template-columns:repeat(3,1fr);row-gap:5px}.b .cell{padding:1px 3px;text-align:center;border-right:1px solid #283b48;min-height:29px}.b .cell:nth-child(3n){border:0}.b .label{display:block;font-size:9px;line-height:12px}.b .value{display:block;line-height:16px}.c{display:grid;grid-template-columns:76px 1fr;gap:10px}.hero{border-right:1px solid #34505f;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px}.hero .value{font-size:20px;color:#8ee6ff}.hero .old{display:block;text-align:center}.hero .next{font-size:17px}.csmall{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}.csmall .cell{display:flex;flex-direction:column;min-height:24px}.csmall .cell:last-child{grid-column:1/-1;flex-direction:row;gap:8px;align-items:center}.csmall .label{font-size:9px}.csmall .value{font-size:11px}.d{display:flex;flex-direction:column;gap:0}.line{display:grid;grid-template-columns:42px 1fr 1fr;align-items:center;min-height:23px;border-bottom:1px solid #263a48}.line:last-child{border:0}.category{font-size:9px;color:#5d8297}.line .cell{display:flex;align-items:center;justify-content:space-between;padding-left:7px}.line .cell+.cell{margin-left:8px}.line .label{font-size:9px}.line .value{font-size:11px}.note{font-size:10px;color:#90acba;margin:10px 5px 0;line-height:1.65}.foot{margin:20px 0 0;font-size:11px;line-height:1.8;color:#8aa6b8}.mini{padding-top:5px;padding-bottom:5px}.mini .meta{display:none}
</style><main><h1>스탯 · 카드 없이 더 촘촘하게</h1><p>동일한 6개 스탯과 수치 · 컴포넌트 폭 360px · 위는 기본, 아래는 레벨업 미리보기</p><div class="grid" id="grid"></div><div class="foot">직접 그린 HTML/CSS 컴포넌트 시안입니다. 게임 코드는 변경하지 않았습니다.<br>화상·감속이 있는 포탑은 같은 규칙으로 항목을 추가하며, 누적 피해 상세 진입은 유지합니다.</div></main><script>
const data=[['피해','25.0','30.0'],['초당','0.40회','0.42회'],['사거리','67','69'],['DPS','10.0','12.6'],['치명 확률','5%'],['치명 피해','150%']];
const val=(d,p)=>p&&d[2]?`<span class="old">${d[1]}</span><span class="arrow">→</span><span class="next">${d[2]}</span>`:d[1];
const cell=(i,p)=>`<div class="cell ${i>3?'crit':''}"><span class="label">${data[i][0]}</span><span class="value">${val(data[i],p)}</span></div>`;
function stats(k,p){if(k==='a')return `<div class="stats a">${[0,3,1,2,4,5].map(i=>cell(i,p)).join('')}</div>`;if(k==='b')return `<div class="stats b">${data.map((_,i)=>cell(i,p)).join('')}</div>`;if(k==='c')return `<div class="stats c"><div class="hero"><span class="label">DPS</span><span class="value">${val(data[3],p)}</span></div><div class="csmall">${[0,1,2,4,5].map(i=>cell(i,p)).join('')}</div></div>`;return `<div class="stats d">${[['공격',0,1],['성능',3,2],['치명',4,5]].map(([l,a,b])=>`<div class="line"><span class="category">${l}</span>${cell(a,p)}${cell(b,p)}</div>`).join('')}</div>`}
const options=[['a','A · 2열 수치표','추천','항목과 수치를 한 줄로. 얇은 구분선만 남겨<br>전체 스탯을 빠르게 훑는 배치.','라벨·수치의 좌우 정렬이 명확합니다. 긴 미리보기에는 열 사이 여유가 필요합니다.'],['b','B · 열린 3열','최소 변경','현재 3열 배치를 유지하고 개별 카드만 제거.<br>기존 항목 위치가 그대로라 적응이 쉽습니다.','변경 폭이 가장 작습니다. 긴 숫자는 같은 셀 안에서 줄바꿈하도록 구현합니다.'],['c','C · DPS 강조','','DPS를 왼쪽에 크게, 세부 수치를 오른쪽에.<br>전투력 확인과 세부 정보 탐색을 구분합니다.','중요 수치는 눈에 잘 들어옵니다. 다른 안보다 높이 절감은 작습니다.'],['d','D · 항목별 목록','','공격·성능·치명으로 묶어 세 줄로 구성.<br>색상과 정렬만으로 범주를 나눕니다.','조밀한 장비 정보창 느낌입니다. 범주명이 추가되어 가로 여유는 가장 적습니다.']];
document.querySelector('#grid').innerHTML=options.map(([k,t,r,d,n])=>`<section class="concept" id="${k}"><h2>${t}<em>${r}</em></h2><div class="desc">${d}</div><div class="state">기본 상태</div><div class="panel"><div class="head">대포 포탑 <small>LV <b>1</b> / 10</small><span class="cost">↗ 63G &nbsp; ◇ 67G</span></div><div class="tabs"><span class="on">▥ 스탯</span><span>◇ 젬 · 링크</span></div><div class="meta"><span class="tag">물리</span><span class="tag heavy">중화기</span><span class="total">누적 피해 &nbsp;<strong>356 ···</strong></span></div>${stats(k,false)}</div><div class="state">레벨업 미리보기 · 스탯 부분</div><div class="panel mini">${stats(k,true)}</div><div class="note">${n}</div></section>`).join('');
</script></html>

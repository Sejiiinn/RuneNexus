<style>
#rn-gem-preview .preview-mount{display:flex;justify-content:center;padding:14px 0 8px}
#rn-gem-preview .rn-game{--ink:#e8f8ff;position:relative;width:min(100%,380px);height:620px;isolation:isolate;overflow:hidden;border-radius:8px;background:#07101a;color:var(--ink);font:12px/1.45 'Noto Sans KR',system-ui,sans-serif;box-shadow:0 8px 30px #0003}
#rn-gem-preview .rn-game *{box-sizing:border-box}
#rn-gem-preview .rn-field{position:absolute;inset:78px 0 36px;background-image:var(--battlefield);background-position:center;background-size:cover}
#rn-gem-preview .rn-hud{position:absolute;left:8px;right:8px;top:8px;display:flex;height:76px;padding:6px;background:#06131df2;border:1px solid #477486;border-radius:4px;color:#c7e4ed;font-size:10px}
#rn-gem-preview .rn-money{width:90px;flex:none;display:flex;flex-direction:column;gap:3px;padding-right:10px;border-right:1px solid #274050}
#rn-gem-preview .rn-gold{color:#f4d670;font-size:13px}
#rn-gem-preview .rn-green{color:#64efb4}
#rn-gem-preview .rn-wave{flex:1;padding-left:8px;min-width:0}
#rn-gem-preview .rn-wave>div{display:flex;justify-content:space-between;gap:4px}
#rn-gem-preview .rn-wave .rn-hp{height:2px;background:#6ce0b2;margin:8px 0 4px}
#rn-gem-preview .rn-view{position:absolute;right:16px;top:95px;font-size:10px;color:#b7d5df}
#rn-gem-preview .rn-bottom{position:absolute;bottom:38px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#bdd8e6}
#rn-gem-preview .rn-speed span,#rn-gem-preview .rn-next{display:inline-block;background:#153c4b;border:1px solid #42788d;padding:6px}
#rn-gem-preview .rn-dock{position:absolute;bottom:0;width:100%;height:34px;background:#0c2636;display:flex;align-items:center;justify-content:space-around;border-top:1px solid #5289a0;font-size:11px}
#rn-gem-preview .rn-shade{position:absolute;inset:0;background:rgba(2,7,13,.68);pointer-events:none}
#rn-gem-preview .rn-modal{position:absolute;left:10px;right:10px;top:50%;transform:translateY(-50%);padding:8px 7px;background:#091624f5;border:1px solid #334957;border-radius:6px;transform-origin:center}
#rn-gem-preview .rn-heading{text-align:center;margin:0 0 8px}
#rn-gem-preview .rn-heading h3{font-family:inherit;font-weight:800;font-size:18px;line-height:1.3;color:#e8f8ff;margin:0 0 3px}
#rn-gem-preview .rn-heading div{font-size:11px;color:#aecedc;font-weight:600}
#rn-gem-preview .rn-cards{display:flex;gap:7px;perspective:750px}
#rn-gem-preview .rn-card{appearance:none;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;height:215px;padding:10px 5px 6px;background:var(--fill);border:1px solid var(--gem);border-radius:8px;color:#b8dce8;font:inherit;transform-origin:50% 65%;text-align:center}
#rn-gem-preview .rn-card:hover{filter:brightness(1.10)}
#rn-gem-preview .rn-card[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--gem),0 0 15px color-mix(in srgb,var(--gem) 25%,transparent)}
#rn-gem-preview .rn-socket{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--gem);border-radius:8px;background:color-mix(in srgb,var(--gem) 22%,#07111d);flex:none}
#rn-gem-preview .rn-socket img{width:29px;height:29px;object-fit:contain}
#rn-gem-preview .rn-name{height:35px;display:flex;align-items:center;justify-content:center;white-space:normal;font-weight:700;font-size:11px;letter-spacing:-.4px}
#rn-gem-preview .rn-effect{display:block;flex:1;padding-top:9px;font-size:10px;line-height:1.65;font-weight:600;word-break:keep-all}
#rn-gem-preview .rn-restriction{display:block;height:20px;font-size:9px;color:#a1a9b0;white-space:nowrap}
#rn-gem-preview .rn-owned{display:block;width:100%;border-radius:12px;height:21px;background:#171b20;border:1px solid #326774;color:#b9d6e4;font-size:10px;line-height:19px}
#rn-gem-preview .rn-unowned{border-color:#52525b;color:#9ca3ab}
#rn-gem-preview .rn-shards{appearance:none;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 4px;min-height:44px;background:#07111d;border:1px solid #28d66f;border-radius:8px;color:#e8f8ff;font:700 10px/1.45 'Noto Sans KR',system-ui,sans-serif;position:relative}
#rn-gem-preview .rn-shards>img{position:absolute;left:8px;width:24px;height:24px;object-fit:contain}
#rn-gem-preview .rn-shards[aria-pressed=true]{background:#0e3624}
#rn-gem-preview .rn-inventory{font-size:10px;color:#badbe9}
#rn-gem-preview .rn-inventory>span{display:flex;gap:5px;align-items:center;margin-top:3px}
#rn-gem-preview .rn-inventory img{width:15px;height:15px;object-fit:contain}
#rn-gem-preview .rn-sheen{position:absolute;inset:0;opacity:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,#ddffff66 45%,transparent 68%);mix-blend-mode:screen}
#rn-gem-preview .rn-scan{position:absolute;left:0;right:0;top:-4px;height:2px;opacity:0;pointer-events:none;background:#a5ffec;box-shadow:0 0 10px #72ffdf,0 0 24px #45e6da}
#rn-gem-preview .rn-rune{position:absolute;left:50%;top:50%;width:160px;height:160px;margin:-80px;opacity:0;pointer-events:none;border:1px solid #74eadb;border-radius:50%;box-shadow:0 0 22px #62e3ce35,inset 0 0 24px #62e3ce35}
#rn-gem-preview .rn-rune:before{content:'';position:absolute;inset:16px;border:1px dashed #9beddd99;border-radius:50%}
#rn-gem-preview .rn-rune:after{content:'';position:absolute;inset:26px;border:1px solid #9bedddaa;transform:rotate(45deg)}
@media(max-width:380px){#rn-gem-preview .rn-game{height:590px}#rn-gem-preview .rn-card{padding-left:3px;padding-right:3px}#rn-gem-preview .rn-name{font-size:10px}#rn-gem-preview .rn-cards{gap:5px}}
</style>

<script>
(() => {
  const root = document.getElementById('rn-gem-preview');
  const assets = JSON.parse(document.getElementById('rn-gem-assets').textContent);
  const template = document.getElementById('rn-gem-screen');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const variants = { rise:580, stagger:860, spread:820, scan:960 };
  const entries = [];
  const stored = window.openai?.widgetState?.privateContent || {};
  function save() { window.openai?.setWidgetState({modelContent:null,privateContent:{slow:entries.map(e=>e.slow)}})?.catch(()=>{}); }
  function make(e, node, frames, duration, delay=0, easing='cubic-bezier(.18,.8,.25,1)') {
    const a = node.animate(frames, {duration,delay,fill:'both',easing});
    a.pause(); e.animations.push(a); return a;
  }
  function setTime(e,t) { for(const a of e.animations) a.currentTime=t; }
  function stop(e) { if(e.frame) cancelAnimationFrame(e.frame); e.frame=null; }
  function reset(e) {
    stop(e); for(const a of e.animations) a.cancel(); e.animations=[];
    e.game.classList.remove('is-playing'); e.cards.forEach(c=>c.disabled=false); e.shards.disabled=false;
  }
  function prepare(e) {
    reset(e);
    e.cards.forEach(c=>c.setAttribute('aria-pressed','false')); e.shards.setAttribute('aria-pressed','false');
    const show=[{opacity:0},{opacity:1}];
    make(e,e.shade,show,240);
    const end='translateY(-50%)';
    if(e.kind==='rise') {
      make(e,e.modal,[{opacity:0,transform:'translateY(calc(-50% + 28px)) scale(.96)'},{opacity:1,transform:end+' scale(1)'}],580);
    } else if(e.kind==='stagger') {
      make(e,e.modal,[{opacity:0,transform:end+' scale(.985)'},{opacity:1,transform:end+' scale(1)'}],220);
      e.cards.forEach((c,i)=>make(e,c,[{opacity:0,transform:'translateY(38px) scale(.88)'},{opacity:1,transform:'translateY(-5px) scale(1.02)',offset:.72},{opacity:1,transform:'translateY(0) scale(1)'}],440,120+i*130));
      make(e,e.shards,show,180,660); make(e,e.inventory,show,180,680);
    } else if(e.kind==='spread') {
      make(e,e.modal,show,250);
      make(e,e.rune,[{opacity:0,transform:'scale(.3) rotate(-35deg)'},{opacity:.8,transform:'scale(.85) rotate(0deg)',offset:.35},{opacity:0,transform:'scale(1.5) rotate(18deg)'}],620);
      const width=e.cards[0].getBoundingClientRect().width+parseFloat(getComputedStyle(e.cardRow).gap);
      e.cards.forEach((c,i)=>make(e,c,[{opacity:0,transform:`translateX(${(1-i)*width}px) translateY(14px) rotate(${(i-1)*-8}deg) scale(.7)`},{opacity:1,transform:'translateX(0) translateY(0) rotate(0) scale(1)'}],560,140+i*35));
      make(e,e.shards,show,160,620); make(e,e.inventory,show,150,670);
    } else {
      make(e,e.rune,[{opacity:0,transform:'scale(.55) rotate(-20deg)'},{opacity:.6,transform:'scale(1) rotate(12deg)',offset:.45},{opacity:0,transform:'scale(1.7) rotate(30deg)'}],650);
      make(e,e.modal,[{opacity:1,clipPath:'inset(0 0 100% 0)'},{opacity:1,clipPath:'inset(0 0 0% 0)'}],680,130,'linear');
      make(e,e.scan,[{opacity:0,transform:'translateY(0)'},{opacity:.95,transform:`translateY(${e.modal.offsetHeight*.08}px)`,offset:.08},{opacity:.85,transform:`translateY(${e.modal.offsetHeight*.9}px)`,offset:.9},{opacity:0,transform:`translateY(${e.modal.offsetHeight}px)`}],680,130,'linear');
      e.sheens.forEach((s,i)=>make(e,s,[{opacity:0,transform:'translateX(-110%)'},{opacity:.75,transform:'translateX(-10%)',offset:.5},{opacity:0,transform:'translateX(110%)'}],330,400+i*90));
    }
    setTime(e,0);
  }
  function play(e) {
    prepare(e);
    if(reduce.matches) {setTime(e,variants[e.kind]);e.status.textContent='선택 대기 · 모션 줄임';return;}
    e.status.textContent='등장 중'; e.game.classList.add('is-playing');
    e.cards.forEach(c=>c.disabled=true); e.shards.disabled=true;
    let start=null;
    function tick(now) {
      if(start===null) start=now;
      const t=Math.min((now-start)*(e.slow?.5:1),variants[e.kind]); setTime(e,t);
      if(t<variants[e.kind]) e.frame=requestAnimationFrame(tick);
      else {e.frame=null;e.game.classList.remove('is-playing');e.cards.forEach(c=>c.disabled=false);e.shards.disabled=false;e.status.textContent='선택 대기';}
    }
    e.frame=requestAnimationFrame(tick);
  }
  root.querySelectorAll('[data-motion]').forEach((section,index)=>{
    section.querySelector('.preview-mount').append(template.content.cloneNode(true));
    const game=section.querySelector('.rn-game');
    game.style.setProperty('--battlefield',`url("${assets.field}")`);
    game.querySelectorAll('[data-asset]').forEach(img=>{img.src=assets[img.dataset.asset];});
    const e={section,game,kind:section.dataset.motion,slow:Boolean(stored.slow?.[index]),animations:[],frame:null,
      modal:game.querySelector('.rn-modal'),shade:game.querySelector('.rn-shade'),rune:game.querySelector('.rn-rune'),scan:game.querySelector('.rn-scan'),
      cards:[...game.querySelectorAll('.rn-card')],cardRow:game.querySelector('.rn-cards'),sheens:[...game.querySelectorAll('.rn-sheen')],shards:game.querySelector('.rn-shards'),inventory:game.querySelector('.rn-inventory'),status:section.querySelector('.state')};
    const slow=section.querySelector('.slow'); slow.setAttribute('aria-pressed',String(e.slow));
    slow.addEventListener('click',()=>{e.slow=!e.slow;slow.setAttribute('aria-pressed',String(e.slow));save();play(e);});
    section.querySelector('.replay').addEventListener('click',()=>play(e));
    e.cards.forEach(c=>c.addEventListener('click',()=>{e.cards.forEach(x=>x.setAttribute('aria-pressed',String(x===c)));e.shards.setAttribute('aria-pressed','false');e.status.textContent=c.querySelector('.rn-name').textContent+' 선택';}));
    e.shards.addEventListener('click',()=>{e.cards.forEach(c=>c.setAttribute('aria-pressed','false'));e.shards.setAttribute('aria-pressed','true');e.status.textContent='파편 획득 선택';});
    entries.push(e);
  });
  const visibilityObserver=new MutationObserver(()=>entries.forEach(e=>{
    if(e.section.hidden && e.frame){reset(e);e.status.textContent='선택 대기';}
  }));
  entries.forEach(e=>visibilityObserver.observe(e.section,{attributes:true,attributeFilter:['hidden']}));
  window.rnGemPreview={entries,play,prepare,seek:(index,time)=>{const e=entries[index];prepare(e);setTime(e,time);},finish:index=>{const e=entries[index];setTime(e,variants[e.kind]);},durations:variants};
})();
</script>

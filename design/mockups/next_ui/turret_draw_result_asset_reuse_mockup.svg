<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="852" height="852" viewBox="0 0 852 852">
  <defs>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123027"/>
      <stop offset="0.5" stop-color="#0a1c17"/>
      <stop offset="1" stop-color="#050c0b"/>
    </linearGradient>
    <linearGradient id="chipGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10251f"/>
      <stop offset="0.5" stop-color="#17362c"/>
      <stop offset="1" stop-color="#10251f"/>
    </linearGradient>
    <filter id="greenTint" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.18 0 0 0 0.10  0 0.75 0 0 0.70  0 0 0.32 0 0.31  0 0 0 1 0"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="390"
  height="844"
  viewBox="0 0 390 844"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Rune Nexus 간소화 웹 부트 로더 시안</title>
  <desc id="description">
    로고와 타이틀 없이 작은 코어 펄스와 하단 로딩 표시만 남긴 초기 실행 화면
  </desc>

  <defs>
    <radialGradient id="background" cx="50%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#123144"/>
      <stop offset="25%" stop-color="#0A1B29"/>
      <stop offset="62%" stop-color="#07111D"/>
      <stop offset="100%" stop-color="#07111D"/>
    </radialGradient>
    <linearGradient id="loading-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8EE6FF" stop-opacity="0"/>
      <stop offset="46%" stop-color="#8EE6FF"/>
      <stop offset="58%" stop-color="#E8FBFF"/>
      <stop offset="100%" stop-color="#8EE6FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="ambient-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="core-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="loading-glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="#07111D"/>
  <rect width="390" height="844" fill="url(#background)"/>

  <circle
    cx="195"
    cy="321"
    r="98"
    fill="none"
    stroke="#2ED3FF"
    stroke-opacity="0.08"
    stroke-width="22"
    filter="url(#ambient-glow)"
  />
  <circle
    cx="195"
    cy="321"
    r="120"
    fill="none"
    stroke="#5EE2FF"
    stroke-opacity="0.07"
  />
  <circle
    cx="195"
    cy="321"
    r="88"
    fill="none"
    stroke="#E7C66A"
    stroke-opacity="0.05"
  />
  <circle
    cx="195"
    cy="321"
    r="44"
    fill="none"
    stroke="#5EE2FF"
    stroke-opacity="0.08"
  />

  <circle
    cx="195"
    cy="321"
    r="28"
    fill="none"
    stroke="#8EE6FF"
    stroke-opacity="0.25"
    stroke-width="1.5"
  />
  <path
    d="M195 293 A28 28 0 0 1 222.4 315.3"
    fill="none"
    stroke="#8EE6FF"
    stroke-linecap="round"
    stroke-width="1.8"
    filter="url(#core-glow)"
  />
  <circle
    cx="216"
    cy="302.5"
    r="2.2"
    fill="#E7C66A"
    filter="url(#core-glow)"
  />

  <rect
    x="186"
    y="312"
    width="18"
    height="18"
    rx="1.5"
    fill="#0F3E52"
    fill-opacity="0.82"
    stroke="#8EE6FF"
    stroke-width="1.5"
    transform="rotate(45 195 321)"
    filter="url(#core-glow)"
  />
  <rect
    x="191.5"
    y="317.5"
    width="7"
    height="7"
    rx="1"
    fill="#E8FBFF"
    transform="rotate(45 195 321)"
  />

  <text
    x="195"
    y="775"
    fill="#B9D6E4"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    font-weight="600"
    text-anchor="middle"
  >게임을 시작하는 중</text>

  <rect
    x="52"
    y="797"
    width="286"
    height="5"
    rx="2.5"
    fill="#2ED3FF"
    fill-opacity="0.09"
    stroke="#5EE2FF"
    stroke-opacity="0.14"
  />
  <rect
    x="110"
    y="798"
    width="108"
    height="3"
    rx="1.5"
    fill="url(#loading-fill)"
    filter="url(#loading-glow)"
  />
</svg>

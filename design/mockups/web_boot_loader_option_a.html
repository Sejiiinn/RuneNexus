<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <title>Rune Nexus Web Boot Loader Mockup</title>
  <style>
    :root {
      color-scheme: dark;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07111d;
    }

    body {
      display: grid;
      place-items: center;
    }

    .boot-screen {
      position: relative;
      width: min(100vw, 390px);
      height: min(100vh, 844px);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, #123144 0%, #0a1b29 25%, #07111d 62%),
        #07111d;
      isolation: isolate;
    }

    .ambient-ring {
      position: absolute;
      top: 38%;
      left: 50%;
      width: 240px;
      height: 240px;
      border: 1px solid rgb(94 226 255 / 7%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 90px rgb(46 211 255 / 5%),
        inset 0 0 70px rgb(46 211 255 / 3%);
    }

    .ambient-ring::before,
    .ambient-ring::after {
      position: absolute;
      inset: 32px;
      content: "";
      border: 1px solid rgb(231 198 106 / 5%);
      border-radius: 50%;
    }

    .ambient-ring::after {
      inset: 76px;
      border-color: rgb(94 226 255 / 8%);
    }

    .core {
      position: absolute;
      top: 38%;
      left: 50%;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
    }

    .core-orbit {
      position: absolute;
      inset: 0;
      border: 1.5px solid rgb(142 230 255 / 24%);
      border-top-color: #8ee6ff;
      border-right-color: rgb(142 230 255 / 58%);
      border-radius: 50%;
      filter: drop-shadow(0 0 6px rgb(46 211 255 / 32%));
      animation: orbit 1.4s linear infinite;
    }

    .core-orbit::after {
      position: absolute;
      top: 3px;
      right: 8px;
      width: 4px;
      height: 4px;
      content: "";
      background: #e7c66a;
      border-radius: 50%;
      box-shadow: 0 0 9px rgb(231 198 106 / 75%);
    }

    .core-diamond {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      border: 1.5px solid #8ee6ff;
      background: rgb(15 62 82 / 78%);
      box-shadow:
        0 0 14px rgb(46 211 255 / 38%),
        inset 0 0 8px rgb(142 230 255 / 30%);
      transform: translate(-50%, -50%) rotate(45deg);
      animation: core-pulse 1.1s ease-in-out infinite alternate;
    }

    .core-diamond::after {
      position: absolute;
      inset: 5px;
      content: "";
      background: #e8fbff;
      border-radius: 1px;
      box-shadow: 0 0 8px #8ee6ff;
    }

    .boot-bottom {
      position: absolute;
      right: 36px;
      bottom: max(42px, env(safe-area-inset-bottom));
      left: 36px;
      text-align: center;
    }

    .boot-caption {
      margin-bottom: 14px;
      color: #b9d6e4;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.1px;
    }

    .loading-track {
      position: relative;
      width: min(100%, 286px);
      height: 5px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgb(94 226 255 / 14%);
      border-radius: 999px;
      background: rgb(46 211 255 / 9%);
    }

    .loading-fill {
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #8ee6ff 48%, #e8fbff 58%, transparent);
      filter: drop-shadow(0 0 4px rgb(142 230 255 / 52%));
      animation: loading 1.25s ease-in-out infinite;
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes core-pulse {
      from {
        opacity: 0.68;
        transform: translate(-50%, -50%) rotate(45deg) scale(0.88);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(45deg) scale(1);
      }
    }

    @keyframes loading {
      from {
        transform: translateX(-105%);
      }
      to {
        transform: translateX(280%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .core-orbit,
      .core-diamond,
      .loading-fill {
        animation: none;
      }

      .loading-fill {
        transform: translateX(82%);
      }
    }
  </style>
</head>
<body>
  <main class="boot-screen" aria-label="Rune Nexus 초기 실행 화면">
    <div class="ambient-ring" aria-hidden="true"></div>
    <div class="core" aria-hidden="true">
      <div class="core-orbit"></div>
      <div class="core-diamond"></div>
    </div>
    <div class="boot-bottom">
      <div class="boot-caption">게임을 시작하는 중</div>
      <div class="loading-track" role="progressbar" aria-label="게임 실행 환경 준비">
        <div class="loading-fill"></div>
      </div>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuneNexus 연구 상세 모달 · 3안 비교</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#07121b;color:#e5f2f8}body{margin:0;padding:28px;max-width:1200px;margin-inline:auto}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6;color:#b2c8d5;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:24px}figure{margin:0;min-width:0}button.preview{display:block;border:1px solid #304a5b;border-radius:4px;padding:0;background:#050b10;width:100%;cursor:zoom-in}img{display:block;max-width:100%;height:580px;object-fit:contain;margin:auto}figcaption{padding:12px 0}strong{color:#d4ecf7}dialog{padding:0;border:1px solid #6b9fb6;background:#050b10;max-width:96vw;max-height:95vh}dialog::backdrop{background:#000c}dialog img{height:auto;max-height:90vh;max-width:90vw}.close{position:absolute;right:8px;top:8px;font-size:22px;padding:4px 12px;background:#07121bdd;color:white;border:1px solid #668391;border-radius:3px;cursor:pointer}.note{font-size:13px}@media(max-width:750px){body{padding:18px}.grid{grid-template-columns:1fr}img{height:auto;max-height:680px}}
</style>
<h1>연구 상세 모달 · 수정 A안 적용</h1>
<p>연구 이름의 반복·설명 프레임·해금 조건 줄을 줄이고, 효과 변화·룬 비용·시간을 정리했습니다. 이미지를 누르면 확대됩니다.</p>
<h2>Godot 실제 적용 화면</h2>
<p class="note">격리된 테스트 진행 상태를 사용하는 실제 Godot 로비 캡처입니다. 아래 제작 시안과 구분합니다.</p>
<div class="grid">
<figure><button class="preview" aria-label="440px 적용 화면 확대"><img src="implementation/research-detail-440.png" alt="440px Godot 연구 상세 모달"></button><figcaption><strong>연구 상세 · 440px</strong><p>설명과 효과 비교, 룬 비용·보유량과 시간을 실제 데이터로 표시합니다.</p></figcaption></figure>
<figure><button class="preview" aria-label="320px 적용 화면 확대"><img src="implementation/research-detail-320.png" alt="320px Godot 연구 상세 모달"></button><figcaption><strong>연구 상세 · 320px</strong><p>좁은 화면에서도 정보와 시작 버튼을 유지합니다.</p></figcaption></figure>
<figure><button class="preview" aria-label="진행 중 적용 화면 확대"><img src="implementation/research-active-320.png" alt="진행 중 Godot 연구 상세 모달"></button><figcaption><strong>연구 진행 중 · 320px</strong><p>남은 시간과 즉시 완료·중단 동작을 유지합니다.</p></figcaption></figure>
</div>
<h2>제작 당시 후보 · 3안 비교</h2>
<p class="note">수정 A안 채택. 후보의 수치는 비교용 예시입니다.</p>
<div class="grid">
<figure><button class="preview" aria-label="A안 확대"><img src="a-compact-v2.png" alt="A안: 간결한 정보 정렬"></button><figcaption><strong>A · 간결한 정보 정렬 · 선택안</strong><p>설명 → 효과 → 비용·시간을 짧게 정렬합니다. 해금 조건 줄을 제거하고 모달 높이를 줄였습니다.</p></figcaption></figure>
<figure><button class="preview" aria-label="B안 확대"><img src="b-effect.png" alt="B안: 효과 변화 강조"></button><figcaption><strong>B · 효과 변화 강조</strong><p>현재와 다음 효과를 중앙에 크게 비교합니다. 연구로 얻는 이득을 먼저 읽게 합니다.</p></figcaption></figure>
<figure><button class="preview" aria-label="C안 확대"><img src="c-action-footer.png" alt="C안: 비용과 시작 버튼을 묶는 구성"></button><figcaption><strong>C · 비용과 시작 버튼 묶기</strong><p>하단 왼쪽의 비용·시간 바로 옆에 짧은 연구 시작 버튼을 둡니다. 결정을 위한 정보와 행동을 가까이 붙입니다.</p></figcaption></figure>
</div>
<p class="note">제작: built-in ImageGen · <a href="prompts.json">제작 프롬프트</a> · <a href="a-revision.json">A안 수정 프롬프트</a></p>
<dialog><button class="close" aria-label="확대 닫기">×</button><img alt="확대한 시안"></dialog>
<script>
const dialog=document.querySelector('dialog');document.querySelectorAll('.preview').forEach(button=>button.addEventListener('click',()=>{const original=button.querySelector('img');dialog.querySelector('img').src=original.src;dialog.querySelector('img').alt=original.alt;dialog.showModal()}));dialog.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
</script>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rune Nexus Core Slot Mockup</title>
    <style>
      :root {
        --bg: #04080f;
        --panel: #071421;
        --panel-2: #0b1b2a;
        --line: rgba(116, 226, 255, 0.28);
        --line-strong: rgba(116, 226, 255, 0.64);
        --text: #eefbff;
        --muted: #91a9b8;
        --cyan: #74e2ff;
        --gold: #ffd166;
        --green: #72e0a2;
        --violet: #b79cff;
        --red: #ff8072;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(circle at 50% 18%, rgba(116, 226, 255, 0.16), transparent 22rem),
          radial-gradient(circle at 20% 72%, rgba(114, 224, 162, 0.08), transparent 18rem),
          linear-gradient(180deg, #07111c, var(--bg));
        font-family:
          Inter,
          "Noto Sans KR",
          "Apple SD Gothic Neo",
          system-ui,
          sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .phone {
        position: relative;
        width: min(430px, calc(100vw - 24px));
        height: min(900px, calc(100vh - 28px));
        min-height: 760px;
        overflow: hidden;
        border: 1px solid rgba(116, 226, 255, 0.34);
        border-radius: 18px;
        background:
          linear-gradient(90deg, rgba(116, 226, 255, 0.05) 1px, transparent 1px),
          linear-gradient(rgba(116, 226, 255, 0.04) 1px, transparent 1px),
          radial-gradient(circle at 50% 34%, rgba(116, 226, 255, 0.11), transparent 13rem),
          linear-gradient(180deg, #071521, #03070d);
        background-size: 34px 34px, 34px 34px, auto, auto;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.58);
      }

      .topbar {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 4;
        display: grid;
        grid-template-columns: 36px 1fr 36px;
        gap: 8px;
        align-items: center;
      }

      .icon-button {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: #dffaff;
        background: rgba(5, 13, 22, 0.82);
        font-size: 17px;
        font-weight: 950;
      }

      .title {
        text-align: center;
        font-size: 16px;
        font-weight: 950;
      }

      .summary {
        position: absolute;
        top: 60px;
        left: 18px;
        right: 18px;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .summary strong {
        display: block;
        font-size: 21px;
        line-height: 1.1;
      }

      .summary span {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
      }

      .level {
        min-width: 58px;
        padding: 8px 9px;
        border: 1px solid rgba(255, 209, 102, 0.42);
        border-radius: 8px;
        color: #ffe3a4;
        background: rgba(255, 209, 102, 0.09);
        text-align: center;
        font-size: 12px;
        font-weight: 950;
      }

      .core-stage {
        position: absolute;
        inset: 124px 16px 270px;
        border: 1px solid rgba(116, 226, 255, 0.12);
        border-radius: 10px;
        background:
          radial-gradient(circle at 50% 50%, rgba(116, 226, 255, 0.12), transparent 7rem),
          radial-gradient(circle at 50% 50%, rgba(255, 209, 102, 0.08), transparent 11rem);
      }

      .ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 244px;
        height: 244px;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(116, 226, 255, 0.24);
        border-radius: 50%;
      }

      .ring::before,
      .ring::after {
        content: "";
        position: absolute;
        inset: 27px;
        border: 1px solid rgba(255, 209, 102, 0.18);
        border-radius: 50%;
      }

      .ring::after {
        inset: 62px;
        border-color: rgba(114, 224, 162, 0.2);
      }

      .core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 130px;
        height: 130px;
        transform: translate(-50%, -50%);
      }

      .socket {
        position: absolute;
        width: 108px;
        min-height: 114px;
        display: grid;
        justify-items: center;
        gap: 4px;
        padding: 8px 7px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(6, 16, 26, 0.9);
        box-shadow: 0 12px 22px rgba(0, 0, 0, 0.32);
      }

      .socket.skill {
        top: 4px;
        left: 50%;
        width: 146px;
        min-height: 136px;
        transform: translateX(-50%);
        border-color: var(--line-strong);
        background:
          linear-gradient(180deg, rgba(116, 226, 255, 0.15), rgba(6, 16, 26, 0.92)),
          rgba(6, 16, 26, 0.9);
      }

      .socket.passive-left {
        left: 14px;
        bottom: 18px;
      }

      .socket.passive-right {
        right: 14px;
        bottom: 18px;
      }

      .socket.locked {
        opacity: 0.68;
        border-color: rgba(145, 169, 184, 0.26);
      }

      .socket.empty {
        border-style: dashed;
        border-color: rgba(114, 224, 162, 0.52);
      }

      .socket-kind {
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
      }

      .socket-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        font-size: 20px;
        font-weight: 950;
      }

      .skill .socket-icon {
        width: 56px;
        height: 56px;
        color: var(--cyan);
        border-color: rgba(116, 226, 255, 0.5);
        background: rgba(116, 226, 255, 0.1);
      }

      .green {
        color: var(--green);
      }

      .gold {
        color: var(--gold);
      }

      .socket-name {
        width: 100%;
        color: var(--text);
        text-align: center;
        font-size: 13px;
        font-weight: 950;
        line-height: 1.2;
      }

      .socket-note {
        min-height: 24px;
        color: var(--muted);
        text-align: center;
        font-size: 10px;
        font-weight: 760;
        line-height: 1.3;
      }

      .socket-action {
        min-height: 24px;
        padding: 4px 9px;
        border: 1px solid rgba(116, 226, 255, 0.34);
        border-radius: 999px;
        color: #dffaff;
        background: rgba(116, 226, 255, 0.08);
        font-size: 10px;
        font-weight: 950;
      }

      .locked .socket-action {
        border-color: rgba(255, 209, 102, 0.28);
        color: #ffdca0;
        background: rgba(255, 209, 102, 0.07);
      }

      .link-line {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2px;
        height: 138px;
        transform-origin: top;
        background: linear-gradient(180deg, rgba(116, 226, 255, 0.4), transparent);
      }

      .link-line.a {
        transform: rotate(180deg);
      }

      .link-line.b {
        transform: rotate(128deg);
      }

      .link-line.c {
        transform: rotate(232deg);
      }

      .bottom-panel {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 56px;
        z-index: 3;
        height: 196px;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        padding: 13px;
        border: 1px solid rgba(116, 226, 255, 0.24);
        border-radius: 10px;
        background:
          linear-gradient(180deg, rgba(116, 226, 255, 0.08), transparent),
          rgba(5, 13, 22, 0.94);
      }

      .library-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .library-title {
        color: #eefbff;
        font-size: 14px;
        font-weight: 950;
      }

      .library-count {
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
        white-space: nowrap;
      }

      .filter-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin-top: 9px;
      }

      .filter {
        min-height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(116, 226, 255, 0.16);
        border-radius: 8px;
        color: var(--muted);
        background: rgba(11, 27, 42, 0.72);
        font-size: 10px;
        font-weight: 950;
      }

      .filter.active {
        color: #eefbff;
        border-color: rgba(116, 226, 255, 0.54);
        background: rgba(116, 226, 255, 0.12);
      }

      .library-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        margin-top: 9px;
        overflow-y: auto;
        padding-right: 2px;
      }

      .library-card {
        min-height: 54px;
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 7px;
        align-items: center;
        padding: 7px;
        border: 1px solid rgba(116, 226, 255, 0.18);
        border-radius: 8px;
        background: rgba(11, 27, 42, 0.82);
      }

      .library-card.equipped {
        border-color: rgba(116, 226, 255, 0.5);
        background: rgba(116, 226, 255, 0.12);
      }

      .library-card.locked {
        opacity: 0.58;
      }

      .library-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        font-size: 17px;
        font-weight: 950;
      }

      .library-name {
        min-width: 0;
      }

      .library-name b {
        display: block;
        overflow: hidden;
        color: #eefbff;
        font-size: 11px;
        font-weight: 950;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .library-name span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 820;
      }

      .library-action {
        min-width: 42px;
        min-height: 28px;
        padding: 0 7px;
        border: 1px solid rgba(255, 209, 102, 0.34);
        border-radius: 7px;
        color: #ffe2a6;
        background: rgba(255, 209, 102, 0.08);
        font-size: 10px;
        font-weight: 950;
        white-space: nowrap;
      }

      .tabs {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }

      .tab {
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(116, 226, 255, 0.14);
        border-radius: 8px;
        color: var(--muted);
        background: rgba(5, 13, 22, 0.72);
        font-size: 11px;
        font-weight: 900;
      }

      .tab.active {
        color: #edfaff;
        border-color: rgba(116, 226, 255, 0.56);
        background: rgba(116, 226, 255, 0.12);
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .spin {
        transform-origin: 65px 65px;
        animation: spin 12s linear infinite;
      }

      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.58;
          transform: scale(0.96);
        }

        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }

      @media (max-height: 820px) {
        .phone {
          min-height: 700px;
        }

        .core-stage {
          inset: 112px 14px 252px;
        }

        .socket {
          min-height: 96px;
        }

        .socket.skill {
          min-height: 112px;
        }

        .bottom-panel {
          bottom: 52px;
          height: 188px;
        }
      }

      @media (max-width: 380px) {
        .socket {
          width: 98px;
        }

        .socket.skill {
          width: 136px;
        }

        .socket.passive-left {
          left: 6px;
        }

        .socket.passive-right {
          right: 6px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="phone">
        <div class="topbar">
          <div class="icon-button">‹</div>
          <div class="title">넥서스 코어</div>
          <div class="icon-button">?</div>
        </div>

        <section class="summary">
          <div>
            <strong>새벽 코어</strong>
            <span>전투 스킬 1칸 / 패시브 2칸</span>
          </div>
          <div class="level">Lv.6</div>
        </section>

        <section class="core-stage">
          <div class="ring"></div>
          <div class="link-line a"></div>
          <div class="link-line b"></div>
          <div class="link-line c"></div>

          <div class="core" aria-hidden="true">
            <svg viewBox="0 0 130 130">
              <circle cx="65" cy="65" r="47" fill="none" stroke="#74e2ff" stroke-opacity=".28" stroke-width="2" />
              <circle cx="65" cy="65" r="34" fill="none" stroke="#ffd166" stroke-opacity=".28" stroke-width="2" stroke-dasharray="8 8" />
              <path class="spin" d="M65 12 L78 47 L116 50 L86 72 L96 109 L65 88 L34 109 L44 72 L14 50 L52 47 Z" fill="rgba(116, 226, 255, .12)" stroke="#74e2ff" stroke-opacity=".75" stroke-width="2" />
              <circle class="pulse" cx="65" cy="65" r="22" fill="#74e2ff" fill-opacity=".18" />
              <circle cx="65" cy="65" r="11" fill="#eefbff" />
            </svg>
          </div>

          <button class="socket skill">
            <span class="socket-kind">전투 스킬</span>
            <span class="socket-icon">✦</span>
            <span class="socket-name">수호 광선</span>
            <span class="socket-note">자동 발동 / 교체 가능</span>
            <span class="socket-action">변경</span>
          </button>

          <button class="socket passive-left">
            <span class="socket-kind">패시브 1</span>
            <span class="socket-icon green">◆</span>
            <span class="socket-name">안정 회로</span>
            <span class="socket-note">낮은 체력에서 충전 가속</span>
            <span class="socket-action">변경</span>
          </button>

          <button class="socket passive-right empty">
            <span class="socket-kind">패시브 2</span>
            <span class="socket-icon gold">＋</span>
            <span class="socket-name">빈 슬롯</span>
            <span class="socket-note">챕터 2 진입 후 확장</span>
            <span class="socket-action">장착</span>
          </button>
        </section>

        <section class="bottom-panel">
          <div class="library-head">
            <div class="library-title">코어 능력</div>
            <div class="library-count">카드 획득으로 성장</div>
          </div>

          <div class="filter-row">
            <div class="filter active">전투 스킬</div>
            <div class="filter">패시브</div>
          </div>

          <div class="library-grid">
            <button class="library-card equipped">
              <span class="library-icon">✦</span>
              <span class="library-name">
                <b>수호 광선</b>
                <span>카드 2/3 / 장착</span>
              </span>
              <span class="library-action">장착중</span>
            </button>
            <button class="library-card">
              <span class="library-icon gold">⌁</span>
              <span class="library-name">
                <b>룬 파동</b>
                <span>카드 1/3 / 교체 가능</span>
              </span>
              <span class="library-action">장착</span>
            </button>
            <button class="library-card equipped">
              <span class="library-icon green">◆</span>
              <span class="library-name">
                <b>안정 회로</b>
                <span>카드 3/3 / 장착</span>
              </span>
              <span class="library-action">장착중</span>
            </button>
            <button class="library-card locked">
              <span class="library-icon">＋</span>
              <span class="library-name">
                <b>공명 축전</b>
                <span>스테이지 2 클리어</span>
              </span>
              <span class="library-action">잠김</span>
            </button>
            <button class="library-card">
              <span class="library-icon">◇</span>
              <span class="library-name">
                <b>정밀 회로</b>
                <span>카드 1/3 / 패시브</span>
              </span>
              <span class="library-action">장착</span>
            </button>
            <button class="library-card locked">
              <span class="library-icon">⟡</span>
              <span class="library-name">
                <b>연쇄 광휘</b>
                <span>챕터 2 해금</span>
              </span>
              <span class="library-action">잠김</span>
            </button>
          </div>
        </section>

        <nav class="tabs">
          <div class="tab">스테이지</div>
          <div class="tab active">코어</div>
          <div class="tab">강화</div>
          <div class="tab">연구</div>
        </nav>
      </div>
    </main>
  </body>
</html>

services:
  api:
    environment:
      GOOGLE_AUTH_ENABLED: "true"
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:?GOOGLE_WEB_CLIENT_ID is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      TRUST_PROXY_HEADERS: "true"

  duckdns:
    image: curlimages/curl:8.21.0
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/rune-nexus/update-duckdns.sh"]
    command: ["run"]
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:?DUCKDNS_SUBDOMAIN is required}
      DUCKDNS_TOKEN_FILE: /run/secrets/duckdns_token
      DUCKDNS_UPDATE_INTERVAL_SECONDS: ${DUCKDNS_UPDATE_INTERVAL_SECONDS:-300}
      DUCKDNS_RETRY_INTERVAL_SECONDS: ${DUCKDNS_RETRY_INTERVAL_SECONDS:-30}
    volumes:
      - ./deploy/duckdns/update-duckdns.sh:/opt/rune-nexus/update-duckdns.sh:ro
    secrets:
      - duckdns_token
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "/bin/sh",
          "/opt/rune-nexus/update-duckdns.sh",
          "healthcheck",
        ]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    init: true
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?API_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - rune_nexus_caddy_data:/data
      - rune_nexus_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      duckdns:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rune_nexus_caddy_data:
  rune_nexus_caddy_config:

secrets:
  duckdns_token:
    file: ./.secrets/duckdns_token
